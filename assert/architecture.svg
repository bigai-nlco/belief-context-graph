<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
  <title id="title">Belief Context Graph architecture</title>
  <desc id="desc">The Agent context manager streams evicted turns through the Graph HTTP service, while the Python SDK calls the same construction backends directly. Unified and hybrid backends share an incremental belief extraction, merge, relation linking, deterministic confidence, and persistence flow. Graph snapshots return to the Agent system prompt.</desc>

  <defs>
    <linearGradient id="agentFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8faff"/>
    </linearGradient>
    <linearGradient id="graphFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5bd6"/>
      <stop offset="1" stop-color="#7472e8"/>
    </linearGradient>
    <linearGradient id="pipelineFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#5b5bd6"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .section { font-size: 14px; font-weight: 750; letter-spacing: 1.5px; fill: #64748b; }
      .title { font-size: 22px; font-weight: 760; fill: #0f172a; }
      .body { font-size: 15px; font-weight: 500; fill: #475569; }
      .small { font-size: 13px; font-weight: 520; fill: #64748b; }
      .chip { font-size: 12px; font-weight: 700; fill: #4338ca; }
      .stageTitle { font-size: 15px; font-weight: 760; fill: #1e293b; }
      .stageBody { font-size: 12px; font-weight: 520; fill: #64748b; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrowPurple { fill: none; stroke: #5b5bd6; stroke-width: 2.6; marker-end: url(#arrowPurple); }
      .feedback { fill: none; stroke: #5b5bd6; stroke-width: 2.3; stroke-dasharray: 8 7; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1400" height="1020" fill="#ffffff"/>

  <g class="font">
    <text id="architecture-title" x="54" y="48" font-size="30" font-weight="800" fill="#0f172a">Belief Context Graph Architecture</text>
    <text x="54" y="76" font-size="15" font-weight="500" fill="#64748b">Agent-agnostic context management · two construction backends · one belief-native graph contract</text>

    <!-- Agent runtime -->
    <rect x="40" y="104" width="1320" height="220" rx="24" fill="url(#agentFill)" stroke="#dbe3f1"/>
    <text x="66" y="134" class="section">AGENT RUNTIME</text>

    <g filter="url(#shadow)">
      <rect x="70" y="155" width="260" height="135" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="395" y="145" width="500" height="155" rx="19" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
      <rect x="960" y="155" width="330" height="135" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
    </g>

    <circle cx="103" cy="188" r="17" fill="#e0e7ff"/>
    <path d="M96 188h14M103 181v14" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round"/>
    <text x="132" y="191" class="title">Any Agent</text>
    <text x="96" y="222" class="body">Reference CLI included</text>
    <text x="96" y="248" class="small">User input · sessions · tools</text>
    <rect x="96" y="262" width="107" height="18" rx="9" fill="#eef2ff"/>
    <text x="149" y="275" text-anchor="middle" class="chip">agent-agnostic</text>

    <rect x="420" y="168" width="9" height="107" rx="4.5" fill="#5b5bd6"/>
    <text x="454" y="186" class="title">BCG Context Manager</text>
    <text x="454" y="217" class="body">Initial user input is always retained</text>
    <text x="454" y="242" class="body">Latest N completed turns remain raw</text>
    <text x="454" y="267" class="body">Evicted turns → Graph · Graph → system prompt</text>
    <rect x="745" y="166" width="121" height="23" rx="11.5" fill="#ede9fe"/>
    <text x="805" y="182" text-anchor="middle" class="chip">BCG mode</text>

    <circle cx="994" cy="188" r="17" fill="#e0f2fe"/>
    <path d="M986 188h16M994 180v16M988 182l12 12M1000 182l-12 12" stroke="#0284c7" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
    <text x="1023" y="191" class="title">Model + Tools</text>
    <text x="986" y="222" class="body">OpenAI-compatible inference</text>
    <text x="986" y="248" class="small">Search · shell · files · extensions</text>
    <text x="986" y="273" class="small">Assistant and tool turns return to context</text>

    <path d="M330 222H382" class="arrow"/>
    <path d="M895 222H947" class="arrowPurple"/>

    <!-- Integration paths -->
    <text x="66" y="365" class="section">INTEGRATION PATHS</text>

    <g filter="url(#shadow)">
      <rect x="145" y="387" width="470" height="150" rx="19" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
      <rect x="785" y="387" width="470" height="150" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="525" y="575" width="350" height="70" rx="18" fill="url(#graphFill)"/>
    </g>

    <text x="175" y="425" class="title">Graph Construction HTTP Service</text>
    <text x="175" y="454" class="body">One ordered streaming session per problem_id</text>
    <text x="175" y="478" class="small">Threaded across independent trajectories</text>
    <g>
      <rect x="175" y="496" width="68" height="24" rx="12" fill="#eef2ff"/>
      <rect x="251" y="496" width="70" height="24" rx="12" fill="#eef2ff"/>
      <rect x="329" y="496" width="79" height="24" rx="12" fill="#eef2ff"/>
      <rect x="416" y="496" width="82" height="24" rx="12" fill="#eef2ff"/>
      <text x="209" y="512" text-anchor="middle" class="chip">/turns</text>
      <text x="286" y="512" text-anchor="middle" class="chip">/graph</text>
      <text x="368" y="512" text-anchor="middle" class="chip">/finalize</text>
      <text x="457" y="512" text-anchor="middle" class="chip">/release</text>
    </g>

    <text x="815" y="425" class="title">Python SDK</text>
    <text x="815" y="456" class="body">BCGRunner — run and session orchestration</text>
    <text x="815" y="482" class="body">BCGMemory — observe, read, search, context</text>
    <text x="815" y="511" class="small">Direct backend access without the HTTP layer</text>

    <text x="700" y="607" text-anchor="middle" font-size="19" font-weight="780" fill="#ffffff">Lazy Backend Registry</text>
    <text x="700" y="628" text-anchor="middle" font-size="12.5" font-weight="560" fill="#e0e7ff">shared contracts · config · sessions</text>

    <path d="M645 300V342Q645 356 631 356H394Q380 356 380 370V374" class="arrowPurple"/>
    <rect x="470" y="333" width="166" height="23" rx="11.5" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="553" y="349" text-anchor="middle" font-size="12.5" font-weight="650" fill="#4f46e5">evicted completed turns</text>
    <path d="M380 537V548Q380 560 392 560H608Q620 560 620 565" class="arrow"/>
    <path d="M1020 537V548Q1020 560 1008 560H792Q780 560 780 565" class="arrow"/>

    <!-- Backends -->
    <text x="66" y="690" class="section">CONSTRUCTION BACKENDS</text>

    <g filter="url(#shadow)">
      <rect x="90" y="711" width="510" height="125" rx="19" fill="#f0fdf4" stroke="#86efac"/>
      <rect x="800" y="711" width="510" height="125" rx="19" fill="#fffbeb" stroke="#fcd34d"/>
    </g>

    <rect x="116" y="735" width="93" height="27" rx="13.5" fill="#dcfce7"/>
    <text x="162" y="753" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">UNIFIED</text>
    <text x="230" y="755" font-size="19" font-weight="760" fill="#14532d">General-purpose Graph LLM</text>
    <text x="116" y="788" class="body">Node, entity and stance extraction · bounded relation windows</text>
    <text x="116" y="814" class="small">Single configurable OpenAI-compatible model path</text>

    <rect x="826" y="735" width="88" height="27" rx="13.5" fill="#fef3c7"/>
    <text x="870" y="753" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">HYBRID</text>
    <text x="935" y="755" font-size="19" font-weight="760" fill="#78350f">Graph LLM + local models</text>
    <text x="826" y="788" class="body">Semantic chunks · embeddings · DeBERTa stance · spaCy NER</text>
    <text x="826" y="814" class="small">Separate extraction and relation generation components</text>

    <path d="M625 645V670Q625 682 613 682H357Q345 682 345 694V698" class="arrow"/>
    <path d="M775 645V670Q775 682 787 682H1043Q1055 682 1055 694V698" class="arrow"/>

    <!-- Shared incremental pipeline -->
    <rect x="40" y="866" width="1320" height="108" rx="22" fill="url(#pipelineFill)" stroke="#d8d5f4"/>
    <text x="66" y="893" class="section">SHARED INCREMENTAL GRAPH SEMANTICS</text>

    <g>
      <rect x="68" y="911" width="174" height="46" rx="13" fill="#ffffff" stroke="#d8dee9"/>
      <rect x="282" y="911" width="174" height="46" rx="13" fill="#ffffff" stroke="#d8dee9"/>
      <rect x="496" y="911" width="174" height="46" rx="13" fill="#ffffff" stroke="#d8dee9"/>
      <rect x="710" y="911" width="174" height="46" rx="13" fill="#ffffff" stroke="#d8dee9"/>
      <rect x="924" y="911" width="174" height="46" rx="13" fill="#ffffff" stroke="#d8dee9"/>
      <rect x="1138" y="911" width="194" height="46" rx="13" fill="#ede9fe" stroke="#c4b5fd"/>

      <text x="155" y="930" text-anchor="middle" class="stageTitle">1 · Split / chunk</text>
      <text x="155" y="948" text-anchor="middle" class="stageBody">role-tagged turn</text>
      <text x="369" y="930" text-anchor="middle" class="stageTitle">2 · Extract</text>
      <text x="369" y="948" text-anchor="middle" class="stageBody">beliefs + evidence</text>
      <text x="583" y="930" text-anchor="middle" class="stageTitle">3 · Merge</text>
      <text x="583" y="948" text-anchor="middle" class="stageBody">canonical nodes</text>
      <text x="797" y="930" text-anchor="middle" class="stageTitle">4 · Link</text>
      <text x="797" y="948" text-anchor="middle" class="stageBody">typed relations</text>
      <text x="1011" y="930" text-anchor="middle" class="stageTitle">5 · Confidence</text>
      <text x="1011" y="948" text-anchor="middle" class="stageBody">deterministic posterior</text>
      <text x="1235" y="930" text-anchor="middle" class="stageTitle" fill="#4338ca">6 · Snapshot</text>
      <text x="1235" y="948" text-anchor="middle" class="stageBody" fill="#5b5bd6">graph + artifacts</text>

      <path d="M242 934H272" class="arrow"/>
      <path d="M456 934H486" class="arrow"/>
      <path d="M670 934H700" class="arrow"/>
      <path d="M884 934H914" class="arrow"/>
      <path d="M1098 934H1128" class="arrowPurple"/>
    </g>

    <path d="M345 836V856" class="arrow"/>
    <path d="M1055 836V856" class="arrow"/>

    <!-- Feedback path -->
    <path d="M1332 934H1372V116H780V135" class="feedback"/>
    <rect x="1148" y="340" width="208" height="44" rx="12" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="1252" y="358" text-anchor="middle" font-size="12.5" font-weight="760" fill="#4f46e5">GRAPH SNAPSHOT</text>
    <text x="1252" y="375" text-anchor="middle" class="small">beliefs · relations · confidence</text>
    <path d="M1356 362H1372" fill="none" stroke="#5b5bd6" stroke-width="2.3" stroke-dasharray="8 7"/>

    <text x="54" y="1004" class="small">Persistent outputs: belief_graph.jsonl · belief_graph_latest.json · result.json · prompt and usage traces</text>
  </g>
</svg>
