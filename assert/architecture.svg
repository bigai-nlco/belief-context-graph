<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 70 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Belief Context Graph architecture</title>
  <desc id="desc">The Agent context manager streams evicted turns through the Graph HTTP service, while the Python SDK calls the same construction backends directly. Unified and hybrid backends share an incremental belief extraction, merge, relation linking, deterministic confidence, and persistence flow. Graph snapshots return to the Agent system prompt.</desc>

  <defs>
    <linearGradient id="agentFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f5ff"/>
      <stop offset="1" stop-color="#fbfcff"/>
    </linearGradient>
    <linearGradient id="graphFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5755d9"/>
      <stop offset="1" stop-color="#7775ea"/>
    </linearGradient>
    <linearGradient id="pipelineFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.075" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
      <path d="M0.5 0.7L8 4.5L0.5 8.3Z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
      <path d="M0.5 0.7L8 4.5L0.5 8.3Z" fill="#5b5bd6"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .section { font-size: 16.5px; font-weight: 780; letter-spacing: 1.7px; fill: #5f6f86; }
      .title { font-size: 25.5px; font-weight: 770; fill: #111827; }
      .body { font-size: 18px; font-weight: 510; fill: #445268; }
      .small { font-size: 15.5px; font-weight: 520; fill: #68768a; }
      .chip { font-size: 14px; font-weight: 700; fill: #4338ca; }
      .stageTitle { font-size: 17.5px; font-weight: 760; fill: #1e293b; }
      .stageBody { font-size: 14.5px; font-weight: 520; fill: #64748b; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrowPurple { fill: none; stroke: #5b5bd6; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .feedback { fill: none; stroke: #5b5bd6; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 7; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1400" height="1020" fill="#fbfcfe"/>

  <g class="font">
    <!-- Agent runtime -->
    <rect x="40" y="104" width="1320" height="205" rx="24" fill="url(#agentFill)" stroke="#d8e0ef" stroke-width="1.2"/>
    <text x="66" y="134" class="section">AGENT RUNTIME</text>

    <g filter="url(#shadow)">
      <rect x="70" y="150" width="260" height="132" rx="17" fill="#ffffff" stroke="#c7d1df"/>
      <rect x="395" y="143" width="500" height="148" rx="19" fill="#ffffff" stroke="#9eaef8" stroke-width="1.6"/>
      <rect x="960" y="150" width="360" height="132" rx="17" fill="#ffffff" stroke="#c7d1df"/>
    </g>

    <circle cx="103" cy="180" r="17" fill="#e0e7ff"/>
    <path d="M96 180h14M103 173v14" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round"/>
    <text x="132" y="188" class="title" style="font-size:24px">Any Agent</text>
    <text x="96" y="214" class="body">Reference CLI included</text>
    <text x="96" y="244" class="small">User input · sessions · tools</text>
    <rect x="82" y="257" width="135" height="19" rx="9" fill="#eef2ff"/>
    <text x="149.5" y="271" text-anchor="middle" class="chip">agent-agnostic</text>

    <rect x="420" y="164" width="9" height="108" rx="4.5" fill="#5b5bd6"/>
    <text x="454" y="183" class="title">BCG Context Manager</text>
    <text x="454" y="214" class="body">Initial user input is always retained</text>
    <text x="454" y="240" class="body">Latest N completed turns remain raw</text>
    <text x="454" y="266" class="body">Evicted turns → Graph</text>
    <rect x="785" y="161" width="80" height="24" rx="11.5" fill="#ede9fe"/>
    <text x="825" y="178" text-anchor="middle" class="chip">BCG mode</text>

    <circle cx="994" cy="180" r="17" fill="#e0f2fe"/>
    <path d="M986 180h16M994 172v16M988 174l12 12M1000 174l-12 12" stroke="#0284c7" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
    <text x="1023" y="188" class="title">Model + Tools</text>
    <text x="986" y="214" class="body">OpenAI-compatible inference</text>
    <text x="986" y="244" class="small">Search · shell · files · extensions</text>
    <text x="986" y="269" class="small">Assistant and tool turns return to context</text>

    <path d="M338 216H383" class="arrow"/>
    <path d="M903 216H948" class="arrowPurple"/>

    <!-- Integration paths -->
    <text x="66" y="346" class="section">INTEGRATION PATHS</text>

    <g filter="url(#shadow)">
      <rect x="145" y="365" width="470" height="140" rx="19" fill="#ffffff" stroke="#9eaef8" stroke-width="1.6"/>
      <rect x="785" y="365" width="470" height="140" rx="19" fill="#ffffff" stroke="#c7d1df"/>
      <rect x="525" y="532" width="350" height="68" rx="18" fill="url(#graphFill)"/>
    </g>

    <text x="175" y="402" class="title" style="font-size:24px">Graph Construction HTTP Service</text>
    <text x="175" y="432" class="body">One ordered streaming session per problem_id</text>
    <text x="175" y="458" class="small">Threaded across independent trajectories</text>
    <g>
      <rect x="175" y="472" width="68" height="25" rx="12" fill="#eef2ff"/>
      <rect x="251" y="472" width="70" height="25" rx="12" fill="#eef2ff"/>
      <rect x="329" y="472" width="79" height="25" rx="12" fill="#eef2ff"/>
      <rect x="416" y="472" width="82" height="25" rx="12" fill="#eef2ff"/>
      <text x="209" y="489" text-anchor="middle" class="chip">/turns</text>
      <text x="286" y="489" text-anchor="middle" class="chip">/graph</text>
      <text x="368" y="489" text-anchor="middle" class="chip">/finalize</text>
      <text x="457" y="489" text-anchor="middle" class="chip">/release</text>
    </g>

    <text x="815" y="402" class="title">Python SDK</text>
    <text x="815" y="433" class="body">BCGRunner — run and session orchestration</text>
    <text x="815" y="460" class="body">BCGMemory — observe, read, search, context</text>
    <text x="815" y="488" class="small">Direct backend access without the HTTP layer</text>

    <text x="700" y="562" text-anchor="middle" font-size="20" font-weight="780" fill="#ffffff">Lazy Backend Registry</text>
    <text x="700" y="584" text-anchor="middle" font-size="15" font-weight="560" fill="#e0e7ff">shared contracts · config · sessions</text>

    <path d="M645 299V329Q645 341 631 341H394Q380 341 380 353V356" class="arrowPurple"/>
    <path d="M805 299V329Q805 341 819 341H1006Q1020 341 1020 353V356" class="arrowPurple"/>
    <rect x="420" y="317" width="216" height="21" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="528" y="332" text-anchor="middle" font-size="14.5" font-weight="650" fill="#4f46e5">evicted completed turns</text>
    <path d="M380 513V548Q380 566 398 566H516" class="arrow"/>
    <path d="M1020 513V548Q1020 566 1002 566H884" class="arrow"/>

    <!-- Backends -->
    <text x="66" y="638" class="section">CONSTRUCTION BACKENDS</text>

    <g filter="url(#shadow)">
      <rect x="90" y="658" width="570" height="120" rx="19" fill="#f1fbf5" stroke="#7fdaa2" stroke-width="1.25"/>
      <rect x="735" y="658" width="605" height="120" rx="19" fill="#fffaf0" stroke="#efc65a" stroke-width="1.25"/>
    </g>

    <rect x="116" y="680" width="93" height="28" rx="13.5" fill="#dcfce7"/>
    <text x="162" y="699" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">UNIFIED</text>
    <text x="230" y="700" font-size="21.5" font-weight="760" fill="#14532d">General-purpose Graph LLM</text>
    <text x="116" y="732" class="body" style="font-size:16.5px">Node, entity and stance extraction · bounded relation windows</text>
    <text x="116" y="758" class="small">Single configurable OpenAI-compatible model path</text>

    <rect x="806" y="680" width="108" height="28" rx="13.5" fill="#fef3c7"/>
    <text x="860" y="699" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">HYBRID</text>
    <text x="935" y="700" font-size="21.5" font-weight="760" fill="#78350f">Graph LLM + local models</text>
    <text x="770" y="732" class="body">Semantic chunks · embeddings · DeBERTa stance · spaCy NER</text>
    <text x="770" y="758" class="small">Separate extraction and relation generation components</text>

    <path d="M625 608V624Q625 636 613 636H357Q345 636 345 648V651" class="arrow"/>
    <path d="M775 608V624Q775 636 787 636H1043Q1055 636 1055 648V651" class="arrow"/>

    <!-- Shared incremental pipeline -->
    <rect x="40" y="805" width="1320" height="105" rx="22" fill="url(#pipelineFill)" stroke="#d4d0f1" stroke-width="1.2"/>
    <text x="66" y="830" class="section">SHARED INCREMENTAL GRAPH SEMANTICS</text>

    <g>
      <rect x="68" y="844" width="174" height="54" rx="13" fill="#ffffff" stroke="#d5dce7"/>
      <rect x="282" y="844" width="174" height="54" rx="13" fill="#ffffff" stroke="#d5dce7"/>
      <rect x="496" y="844" width="174" height="54" rx="13" fill="#ffffff" stroke="#d5dce7"/>
      <rect x="710" y="844" width="174" height="54" rx="13" fill="#ffffff" stroke="#d5dce7"/>
      <rect x="924" y="844" width="174" height="54" rx="13" fill="#ffffff" stroke="#d5dce7"/>
      <rect x="1138" y="844" width="194" height="54" rx="13" fill="#f0edff" stroke="#bcb5fa"/>

      <text x="155" y="866" text-anchor="middle" class="stageTitle">1 · Split / chunk</text>
      <text x="155" y="887" text-anchor="middle" class="stageBody">role-tagged turn</text>
      <text x="369" y="866" text-anchor="middle" class="stageTitle">2 · Extract</text>
      <text x="369" y="887" text-anchor="middle" class="stageBody">beliefs + evidence</text>
      <text x="583" y="866" text-anchor="middle" class="stageTitle">3 · Merge</text>
      <text x="583" y="887" text-anchor="middle" class="stageBody">canonical nodes</text>
      <text x="797" y="866" text-anchor="middle" class="stageTitle">4 · Link</text>
      <text x="797" y="887" text-anchor="middle" class="stageBody">typed relations</text>
      <text x="1011" y="866" text-anchor="middle" class="stageTitle">5 · Confidence</text>
      <text x="1011" y="887" text-anchor="middle" class="stageBody">deterministic posterior</text>
      <text x="1235" y="866" text-anchor="middle" class="stageTitle" fill="#4338ca">6 · Snapshot</text>
      <text x="1235" y="887" text-anchor="middle" class="stageBody" fill="#5b5bd6">graph + artifacts</text>

      <path d="M249 871H273" class="arrow"/>
      <path d="M463 871H487" class="arrow"/>
      <path d="M677 871H701" class="arrow"/>
      <path d="M891 871H915" class="arrow"/>
      <path d="M1105 871H1129" class="arrowPurple"/>
    </g>

    <path d="M345 786V797" class="arrow"/>
    <path d="M1055 786V797" class="arrow"/>

    <!-- Feedback path -->
    <path d="M1340 871H1372V116H780V136" class="feedback"/>
    <rect x="1088" y="312" width="268" height="42" rx="11" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="1222" y="330" text-anchor="middle" font-size="14.5" font-weight="760" fill="#4f46e5">GRAPH SNAPSHOT</text>
    <text x="1222" y="348" text-anchor="middle" font-size="15" font-weight="520" fill="#64748b">beliefs · relations · confidence</text>
    <path d="M1364 333H1372" fill="none" stroke="#5b5bd6" stroke-width="1.8" stroke-dasharray="7 7"/>

  </g>
</svg>
