services:
  belief_tracer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-asllm:1.10.7-poc-pytorch2.9.0-ubuntu24.04-sail2.1.0-cuda13.0-sglang0.5.10-vllm0.19.0-py312}
    image: belief_tracer:local
    container_name: belief_tracer
    working_dir: /workspace/belief_tracer
    command: ["run", "gpqa_diamond", "--model", "/data/share/models/Qwen3-14B"]
    stdin_open: true
    tty: true
    ipc: host
    network_mode: host
    privileged: true
    shm_size: "16gb"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace/belief_tracer:/workspace/rllm
    volumes:
      - .:/workspace/belief_tracer
      - /data/share/models:/data/share/models
      - /home/liuyang/app/rllm:/workspace/rllm
      - ./artifacts:/workspace/belief_tracer/artifacts
