[project]
name = "bcg"
version = "0.1.0"
description = "Belief Context Graph SDK."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "httpx>=0.28.1",
    "langfuse>=4.7.1",
    "numpy>=1.21",
    "openai>=2.40.0",
    "pydantic>=2.13.4",
    "rich",
    "sentence-transformers",
    "spacy",
    "transformers",
    "typer>=0.16",
]
# The interactive Agent is a separate Node runtime. Python dependencies only
# cover the BCG SDK and Graph Construction service.

[project.optional-dependencies]
benchmarks = [
    "pandas>=2.2",
    "pyarrow>=18",
]

[project.scripts]
bcg = "bcg.cli:main"

[dependency-groups]
dev = ["pre-commit>=4.0.1", "pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["bcg"]

[tool.hatch.build.targets.wheel.force-include]
"bcg/model_config.example.json" = "bcg/model_config.example.json"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 88
# The two integrated upstream applications retain their established formatting
# for now. Keep lint enforcement on the original SDK surface while their large
# legacy trees are migrated incrementally.
extend-exclude = [
    "annotation",
    "bcg/construct",
    "bcg/online_server.py",
    "bcg/run.py",
    "bcg/visualize_beliefs_graph.py",
    "datasets",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
