[project]
name = "bcg"
version = "0.1.0"
description = "Belief Context Graph SDK."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langfuse>=4.7.1",
    "openai>=2.40.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = ["pre-commit>=4.0.1", "pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 88


[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
