name: Main Branch Policy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  no-direct-push:
    name: No direct push to main
    runs-on: ubuntu-latest

    steps:
      - name: Check whether push came from a pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const commitSha = context.sha;
            const headCommitMessage = context.payload.head_commit?.message ?? "";

            if (/^Merge pull request #\d+ from /m.test(headCommitMessage)) {
              core.info(`Commit ${commitSha} is a GitHub pull request merge commit.`);
              return;
            }

            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: commitSha,
            });

            if (pulls.length > 0) {
              core.info(`Commit ${commitSha} is associated with PR #${pulls[0].number}.`);
              return;
            }

            core.setFailed([
              "Direct push to main is not allowed by project policy.",
              "Open a pull request and merge after review instead.",
              `Actor: ${context.actor}`,
              `Commit: ${commitSha}`,
            ].join("\n"));
