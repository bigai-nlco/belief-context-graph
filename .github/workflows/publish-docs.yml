name: Publish Docs
on:
  push:
    branches: [main]
    paths: ['docs/fern/**']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g fern-api
      - run: fern generate --docs
        working-directory: docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}