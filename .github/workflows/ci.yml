name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: agent-cli/npm-shrinkwrap.json

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Install Agent dependencies
        run: npm --prefix agent-cli ci

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Compile Python
        run: uv run python -m compileall -q bcg scripts tests

      - name: Test
        run: uv run pytest

      - name: Build Agent
        run: npm --prefix agent-cli run build

      - name: Test Agent
        run: npm --prefix agent-cli test
