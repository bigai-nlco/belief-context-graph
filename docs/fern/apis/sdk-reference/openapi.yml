  /graph/next-belief-id:
    get:
      tags:
      - Graph
      operationId: sdk_BCG_next_belief_id
      summary: Get next belief ID
      description: Read the next available belief identifier without reserving it.
      x-bcg-python-symbol: BCG.next_belief_id
      x-bcg-python-kind: property
      x-fern-explorer: false
      x-fern-examples:
      - name: Python
        code-samples:
        - sdk: python
          code: 'from bcg import BCG


            graph = BCG()

            print(graph.next_belief_id)

            '
      responses:
        '200':
          description: Retrieved
          content:
            application/json:
              schema:
                type: integer
              examples:
