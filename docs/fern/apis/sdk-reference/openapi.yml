                  value: 0
  /graph/add-relation:
    post:
      tags:
      - Graph
      operationId: sdk_BCG_add_relation
      summary: Add relation
      description: Add a typed relation between two graph nodes.
      x-bcg-python-symbol: BCG.add_relation
      x-bcg-python-kind: method
      x-fern-explorer: false
      x-fern-examples:
      - name: Python
        code-samples:
        - sdk: python
          code: "from bcg import BCG\nfrom bcg.core.graph import BeliefPayload, BeliefSource\n\ngraph = BCG()\nsource = BeliefSource(\n\
            \    type=\"message\",\n    role=\"user\",\n    trajectory_index=0,\n    segment_index=0,\n    segment_type=\"\
            message\",\n)\n\nfirst = graph.add_belief(\n    BeliefPayload(\n        id=graph.allocate_belief_id(),\n     \
            \   belief=\"Acme experienced repeated outages.\",\n        layer=\"io\",\n        source=source,\n    )\n)\n\
            second = graph.add_belief(\n    BeliefPayload(\n        id=graph.allocate_belief_id(),\n        belief=\"Acme\
            \ is at churn risk.\",\n        layer=\"reasoning\",\n        source=source,\n    )\n)\n\nfrom bcg.core.graph\
            \ import RelationPayload\n\nedge = graph.add_relation(\n    RelationPayload(\n        from_id=first.belief.id,\n\
            \        to_id=second.belief.id,\n        type=\"depends_on\",\n        note=\"Churn risk depends on the outage\
            \ history.\",\n    ),\n    source_uuid=first.uuid,\n    target_uuid=second.uuid,\n)\n\nprint(edge.relation.type)\n"
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BCGEdge'
              examples:
                success:
                  summary: Added
                  value:
                    uuid: 33333333-3333-4333-8333-333333333333
                    source: 11111111-1111-4111-8111-111111111111
                    target: 22222222-2222-4222-8222-222222222222
                    weight: 0.5
                    relation:
                      from_id: 0
                      to_id: 1
                      type: depends_on
                      note: Churn risk depends on the outage history.
                      weight: 0.5
                      activated_condition:
                        input_conf_threshold: 0.8
                    created_at: '2026-06-12T10:01:00Z'
                    updated_at: '2026-06-12T10:01:00Z'
                    metadata:
                      relation_type: depends_on
                    payload:
                      from_id: 0
                      to_id: 1
                      type: depends_on
                      note: Churn risk depends on the outage history.
                      weight: 0.5
                      activated_condition:
                        input_conf_threshold: 0.8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                relation:
                  type: object
                  additionalProperties: true
                  description: Typed `RelationPayload`.
                source_uuid:
                  type: string
                  description: UUID of the source `BCGNode`.
                target_uuid:
                  type: string
                  description: UUID of the target `BCGNode`.
              additionalProperties: false
              required:
              - relation
              - source_uuid
              - target_uuid
  /graph/add-relation-by-ids:
    post:
      tags:
      - Graph
      operationId: sdk_BCG_add_relation_by_ids
      summary: Add relation by belief IDs
      description: Add a relation by resolving its source and target belief IDs.
      x-bcg-python-symbol: BCG.add_relation_by_ids
      x-bcg-python-kind: method
      x-fern-explorer: false
      x-fern-examples:
      - name: Python
        code-samples:
        - sdk: python
          code: "from bcg import BCG\nfrom bcg.core.graph import BeliefPayload, BeliefSource\n\ngraph = BCG()\nsource = BeliefSource(\n\
            \    type=\"message\",\n    role=\"user\",\n    trajectory_index=0,\n    segment_index=0,\n    segment_type=\"\
            message\",\n)\n\nfirst = graph.add_belief(\n    BeliefPayload(\n        id=graph.allocate_belief_id(),\n     \
            \   belief=\"Acme experienced repeated outages.\",\n        layer=\"io\",\n        source=source,\n    )\n)\n\
            second = graph.add_belief(\n    BeliefPayload(\n        id=graph.allocate_belief_id(),\n        belief=\"Acme\
            \ is at churn risk.\",\n        layer=\"reasoning\",\n        source=source,\n    )\n)\n\nfrom bcg.core.graph\
            \ import RelationPayload\n\nedge = graph.add_relation_by_ids(\n    RelationPayload(\n        from_id=first.belief.id,\n\
            \        to_id=second.belief.id,\n        type=\"depends_on\",\n        note=\"Churn risk depends on the outage\
            \ history.\",\n    )\n)\n\nprint(edge is not None)\n"
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BCGEdge'
              examples:
                success:
                  summary: Added
                  value:
                    uuid: 33333333-3333-4333-8333-333333333333
                    source: 11111111-1111-4111-8111-111111111111
                    target: 22222222-2222-4222-8222-222222222222
                    weight: 0.5
                    relation:
                      from_id: 0
                      to_id: 1
                      type: depends_on
                      note: Churn risk depends on the outage history.
                      weight: 0.5
                      activated_condition:
                        input_conf_threshold: 0.8
                    created_at: '2026-06-12T10:01:00Z'
                    updated_at: '2026-06-12T10:01:00Z'
                    metadata:
                      relation_type: depends_on
                    payload:
                      from_id: 0
                      to_id: 1
                      type: depends_on
                      note: Churn risk depends on the outage history.
                      weight: 0.5
                      activated_condition:
                        input_conf_threshold: 0.8
        '404':
          description: Belief endpoint not found
          content:
            application/json:
              schema:
                type: 'null'
              examples:
                missingEndpoint:
                  summary: Source or target belief ID is missing
                  value: null
        '409':
          description: Relation already exists
          content:
            application/json:
              schema:
                type: 'null'
              examples:
                duplicateRelation:
                  summary: Duplicate relation
                  value: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                relation:
                  type: object
                  additionalProperties: true
                  description: Typed `RelationPayload` whose IDs already exist in the graph.
              additionalProperties: false
              required:
              - relation
  /graph/add-relations:
    post:
      tags:
      - Graph
      operationId: sdk_BCG_add_relations
      summary: Add relations
      description: Validate and add multiple relation records.
      x-bcg-python-symbol: BCG.add_relations
      x-bcg-python-kind: method
      x-fern-explorer: false
      x-fern-examples:
      - name: Python
        code-samples:
        - sdk: python
          code: "from bcg import BCG\nfrom bcg.core.graph import BeliefPayload, BeliefSource\n\ngraph = BCG()\nsource = BeliefSource(\n\
            \    type=\"message\",\n    role=\"user\",\n    trajectory_index=0,\n    segment_index=0,\n    segment_type=\"\
            message\",\n)\n\nfirst = graph.add_belief(\n    BeliefPayload(\n        id=graph.allocate_belief_id(),\n     \
            \   belief=\"Acme experienced repeated outages.\",\n        layer=\"io\",\n        source=source,\n    )\n)\n\
            second = graph.add_belief(\n    BeliefPayload(\n        id=graph.allocate_belief_id(),\n        belief=\"Acme\
            \ is at churn risk.\",\n        layer=\"reasoning\",\n        source=source,\n    )\n)\n\nadded = graph.add_relations(\n\
            \    [\n        {\n            \"from_id\": first.belief.id,\n            \"to_id\": second.belief.id,\n     \
            \       \"type\": \"depends_on\",\n            \"note\": \"Churn risk depends on the outage history.\",\n    \
            \    }\n    ]\n)\n\nprint(added)\n"
      responses:
        '200':
          description: Processed
          content:
            application/json:
              schema:
                type: integer
              examples:
                relationsAdded:
                  summary: Relations added
                  value: 1
                nothingAdded:
                  summary: No new relation added
                  value: 0
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PythonException'
              examples:
                invalidRelation:
                  summary: Invalid relation payload
                  value:
                    exception: ValidationError
                    message: RelationPayload validation failed for one relation dictionary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                relations:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: Relation dictionaries accepted by `RelationPayload.model_validate()`.
              additionalProperties: false
              required:
              - relations
