openapi: 3.1.0
x-fern-explorer: false
info:
  title: Python SDK Reference
  version: 1.0.0
  description: Python methods for working with graphs, memory, construction, models, and configuration.
tags:
- name: Graph
- name: Memory
- name: Construction
- name: Model
- name: Configuration
paths:
  /graph/add-node:
    post:
      tags:
      - Graph
      operationId: sdk_BCG_add_node
      summary: Add node
      description: Add an existing graph node to the in-memory graph.
      x-bcg-python-symbol: BCG.add_node
      x-bcg-python-kind: async method
      x-fern-explorer: false
      x-fern-examples:
      - name: Python
        code-samples:
        - sdk: python
          code: "import asyncio\n\nfrom bcg import BCG\nfrom bcg.core.graph import BCGNode\n\n\nasync def main() -> None:\n\
            \    graph = BCG()\n    node = BCGNode(name=\"Manual graph node\")\n    await graph.add_node(node)\n\n    print(graph.nodes[0].name)\n\
            \n\nasyncio.run(main())\n"
      responses:
        '204':
          description: Added
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                node:
                  type: object
                  additionalProperties: true
                  description: A fully constructed `BCGNode`.
              additionalProperties: false
              required:
              - node
  /graph/add-edge:
    post:
      tags:
      - Graph
      operationId: sdk_BCG_add_edge
      summary: Add edge
      description: Add an existing graph edge to the in-memory graph.
      x-bcg-python-symbol: BCG.add_edge
      x-bcg-python-kind: async method
      x-fern-explorer: false
      x-fern-examples:
      - name: Python
        code-samples:
        - sdk: python
          code: "import asyncio\n\nfrom bcg import BCG\nfrom bcg.core.graph import BCGEdge, BCGNode\n\n\nasync def main()\
            \ -> None:\n    graph = BCG()\n    source = BCGNode(name=\"Source\")\n    target = BCGNode(name=\"Target\")\n\n\
            \    await graph.add_node(source)\n    await graph.add_node(target)\n    await graph.add_edge(\n        BCGEdge(source=source.uuid,\
            \ target=target.uuid)\n    )\n\n    print(len(graph.edges))\n\n\nasyncio.run(main())\n"
      responses:
        '204':
          description: Added
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edge:
                  type: object
                  additionalProperties: true
                  description: A fully constructed `BCGEdge`.
              additionalProperties: false
              required:
              - edge
  /graph/add-belief:
