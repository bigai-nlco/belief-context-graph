                success:
                  summary: Loaded
                  value:
                  - schema_version: 1
                    backend: unified
                    model_key: graph-model
                    embedding_key: embedding
                    server:
                      host: 127.0.0.1
                      port: 8848
                    models:
                      graph-model:
                        provider: openai
