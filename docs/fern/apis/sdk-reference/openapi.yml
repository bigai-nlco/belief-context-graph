  /graph/allocate-belief-id:
    post:
      tags:
      - Graph
      operationId: sdk_BCG_allocate_belief_id
      summary: Allocate belief ID
      description: Reserve and return the next belief identifier.
      x-bcg-python-symbol: BCG.allocate_belief_id
      x-bcg-python-kind: method
      x-fern-explorer: false
      x-fern-examples:
      - name: Python
        code-samples:
        - sdk: python
          code: 'from bcg import BCG


            graph = BCG()


            belief_id = graph.allocate_belief_id()

            print(belief_id)

            print(graph.next_belief_id)

            '
      responses:
        '200':
          description: Allocated
          content:
            application/json:
              schema:
                type: integer
              examples:
