  /graph/remap-relations:
    patch:
      tags:
      - Graph
      operationId: sdk_BCG_remap_relations
      summary: Remap relations
      description: Rewrite relation endpoints after belief IDs are merged or remapped.
      x-bcg-python-symbol: BCG.remap_relations
      x-bcg-python-kind: method
      x-fern-explorer: false
      x-fern-examples:
      - name: Python
        code-samples:
        - sdk: python
          code: "from bcg import BCG\nfrom bcg.core.graph import BeliefPayload, BeliefSource, RelationPayload\n\ngraph = BCG()\n\
            source = BeliefSource(\n    type=\"message\",\n    role=\"user\",\n    trajectory_index=0,\n    segment_index=0,\n\
            \    segment_type=\"message\",\n)\n\nnodes = [\n    graph.add_belief(\n        BeliefPayload(\n            id=graph.allocate_belief_id(),\n\
            \            belief=text,\n            layer=\"io\",\n            source=source,\n        )\n    )\n    for text\
            \ in [\n        \"Canonical outage belief.\",\n        \"Churn risk depends on the outage.\",\n        \"Duplicate\
            \ outage belief.\",\n    ]\n]\n\ngraph.add_relation_by_ids(\n    RelationPayload(from_id=2, to_id=1, type=\"depends_on\"\
            )\n)\n\nreport = graph.remap_relations({2: 0})\nprint(report)\n"
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - rewritten
                - dropped_self
                - dropped_direction
                - dropped_duplicate
                properties:
                  rewritten:
                    type: integer
                  dropped_self:
                    type: integer
                  dropped_direction:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  dropped_duplicate:
                    type: integer
              examples:
                success:
                  summary: Updated
                  value:
                    rewritten: 1
                    dropped_self: 0
                    dropped_direction: []
                    dropped_duplicate: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mapping:
                  type: object
                  additionalProperties: true
                  description: Mapping of old belief IDs to surviving canonical belief IDs.
              additionalProperties: false
              required:
              - mapping
