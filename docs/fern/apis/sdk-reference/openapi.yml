            \    source_type=\"message\",\n    content=\"Acme is threatening to churn after repeated outages.\",\n)\n\nupdated\
            \ = observation.belief.model_copy(\n    update={\"belief\": \"Acme is at elevated churn risk.\"}\n)\n\ngraph.update_belief(updated)\n\
