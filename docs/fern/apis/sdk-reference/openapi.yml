                        min_content_len: 0
                    runner:
                      evidence_mode: sentence
                      incremental_merge: true
                      incremental_merge_threshold: 0.86
                      verify_merge: false
                      context_chars: 100000
                      io_context_chars: 6000
                      min_content_len: 0
                  - schema_version: packaged defaults
                    backend: packaged defaults
                    model_key: packaged defaults
                    embedding_key: packaged defaults
                    server.host: packaged defaults
                    server.port: packaged defaults
                    runner.evidence_mode: packaged defaults
