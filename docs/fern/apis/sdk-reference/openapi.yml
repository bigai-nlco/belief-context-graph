          description: Configuration file error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PythonException'
              examples:
                missingExplicitFile:
                  summary: Explicit config file not found
                  value:
                    exception: BCGConfigError
                    message: 'explicit config file does not exist: /path/to/bcg.yaml'
                notMapping:
                  summary: Config file is not a YAML mapping
                  value:
