        title: Get node by belief ID
        slug: get-node-by-belief-id
      - endpoint: PATCH /graph/update-belief
        title: Update belief
        slug: update-belief
      - endpoint: DELETE /graph/remove-belief
        title: Remove belief
        slug: remove-belief
      - endpoint: GET /graph/relation-dictionaries
        title: Get relation dictionaries
        slug: get-relation-dictionaries
      - endpoint: PATCH /graph/remap-relations
        title: Remap relations
        slug: remap-relations
      - endpoint: GET /graph/memory-dictionary
        title: Export memory dictionary
        slug: export-memory-dictionary
    - section: Memory
      slug: memory
      collapsed: false
      contents:
      - endpoint: POST /memory/observe
        title: Observe belief
        slug: observe-belief
      - endpoint: GET /memory/believe
        title: Find beliefs
        slug: find-beliefs
