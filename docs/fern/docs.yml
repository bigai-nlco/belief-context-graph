    - page: HTTP streaming
      path: ./pages/guides/http-streaming.mdx
      slug: http-streaming
    - page: Batch construction
      path: ./pages/guides/batch.mdx
      slug: batch
    - page: Add known facts
      path: ./pages/guides/known-facts.mdx
      slug: known-facts
    - page: Choose a construction mode
      path: ./pages/construction/compare.mdx
      slug: construction-modes
    - page: API model construction
      path: ./pages/construction/api-model.mdx
      slug: api-model
    - page: Local model construction
      path: ./pages/construction/local-models.mdx
      slug: local-models
    - page: Reference terminal Agent
      path: ./pages/reference-agent.mdx
