- tab: api
  layout:
  - api: HTTP API
    summary: ./pages/api/overview.mdx
    paginated: true
    skip-slug: true
    tag-description-pages: true
    display-errors: true
navbar-links:
- type: minimal
  text: GitHub
  url: https://github.com/bigai-nlco/belief-context-graph
logo:
  light: ./assets/favicon.svg
  dark: ./assets/favicon.svg
  right-text: Belief Context Graph
  height: 29
  href: https://github.com/bigai-nlco/belief-context-graph
colors:
  accent-primary:
    light: '#b8442f'
    dark: '#e58b79'
  background:
    light: '#faf7f2'
    dark: '#171513'
  border:
    light: '#e8e2d8'
    dark: '#3b332c'
  sidebar-background:
    light: '#ffffff'
    dark: '#1e1a17'
  header-background:
    light: '#ffffff'
    dark: '#1e1a17'
