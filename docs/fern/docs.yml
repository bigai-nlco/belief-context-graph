      path: ./pages/overview.mdx
      slug: overview
    - page: Installation
      path: ./pages/installation.mdx
      slug: installation
    - page: Quickstart
      path: ./pages/quickstart.mdx
      slug: quickstart
    - page: Understand your first graph
      path: ./pages/first-graph.mdx
      slug: first-graph
    - page: Choose an integration
      path: ./pages/choose-an-integration.mdx
      slug: choose-an-integration
  - section: Understand BCG
    slug: concepts
    collapsed: true
    contents:
    - page: Key concepts
      path: ./pages/concepts/overview.mdx
      slug: overview
    - page: Knowledge, decisions, and sources
      path: ./pages/concepts/knowledge-and-sources.mdx
      slug: knowledge-and-sources
    - page: How confidence is calculated
      path: ./pages/concepts/confidence.mdx
      slug: confidence
    - page: Relationships and duplicate handling
