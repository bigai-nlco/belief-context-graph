        title: Get task context
        slug: get-task-context
      - endpoint: POST /memory/search
        title: Search beliefs
        slug: search-beliefs
    - section: Construction
      slug: construction
      collapsed: true
      contents:
      - endpoint: POST /construction/trajectory
        title: Process trajectory
        slug: process-trajectory
      - endpoint: POST /construction/run
        title: Start run
        slug: start-run
      - endpoint: POST /construction/session
        title: Start session
        slug: start-session
      - endpoint: POST /construction/turn
        title: Observe turn
        slug: observe-turn
      - endpoint: POST /construction/end-session
        title: End session
        slug: end-session
      - endpoint: POST /construction/finalize
        title: Finalize run
        slug: finalize-run
    - section: Model
      slug: model
      collapsed: true
      contents:
      - endpoint: POST /model/generate
        title: Generate response
        slug: generate-response
      - endpoint: POST /model/generate-text
        title: Generate text
        slug: generate-text
      - endpoint: POST /model/generate-json
        title: Generate JSON
        slug: generate-json
      - endpoint: DELETE /model/close
        title: Close client
        slug: close-client
      - endpoint: POST /model/image
        title: Analyze image
        slug: analyze-image
    - section: Configuration
      slug: configuration
      collapsed: true
      contents:
      - endpoint: GET /configuration/settings
        title: Load settings
        slug: load-settings
