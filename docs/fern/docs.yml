# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
instances:
- url: belief-context-graph.docs.buildwithfern.com
title: Belief Context Graph
tabs:
  docs:
    display-name: Documentation
    icon: book-open
    skip-slug: true
  sdk:
    display-name: SDK Reference
    icon: code
    slug: sdk
  api:
    display-name: HTTP API
    icon: server
    slug: api
theme:
  sidebar: default
  body: default
  tabs:
    style: default
    alignment: left
    placement: header
  page-actions: toolbar
  footer-nav: minimal
navigation:
- tab: docs
  layout:
  - section: Start here
    skip-slug: true
    collapsed: open-by-default
    contents:
