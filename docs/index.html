<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>BCG Documentation</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#/index">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <path d="M5 23L12 7l8 15 7-11" fill="none" stroke="#6b89b8" stroke-width="2"/>
          <path d="M12 7l15 4" fill="none" stroke="#1f6a35" stroke-width="2"/>
          <circle cx="5" cy="23" r="3" fill="#e0ecfa" stroke="#1e5a9c" stroke-width="1.5"/>
          <circle cx="12" cy="7" r="3" fill="#fbe3ee" stroke="#8b2c5b" stroke-width="1.5"/>
          <circle cx="20" cy="22" r="3" fill="#e1f0e4" stroke="#2e6e3a" stroke-width="1.5"/>
          <circle cx="27" cy="11" r="3" fill="#efe6fd" stroke="#7c3aed" stroke-width="1.5"/>
        </svg>
      </span>
      <span class="brand-copy"><strong>Belief Context Graph</strong></span>
    </a>
    <div class="header-center">
      <button class="search-trigger" id="searchTrigger" type="button">
        <span aria-hidden="true">⌕</span>
        <span>Search documentation</span>
        <kbd>⌘ K</kbd>
      </button>
    </div>
    <div class="header-actions">
      <button class="icon-button" id="printPage" type="button" title="Print current page">⎙</button>
      <button class="icon-button mobile-menu" id="mobileMenu" type="button" title="Open navigation">☰</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebarNav" aria-label="Documentation navigation"></aside>
    <main class="main">
      <div class="content-grid">
        <article class="article" id="article"></article>
        <aside class="toc" id="toc" aria-label="On this page"></aside>
      </div>
    </main>
  </div>

  <div class="search-overlay" id="searchOverlay" aria-hidden="true">
    <section class="search-dialog" role="dialog" aria-modal="true" aria-label="Search documentation">
      <div class="search-input-row">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Search beliefs, confidence, server, API…">
        <button class="search-close" id="searchClose" type="button">Esc</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </section>
  </div>

  <script src="assets/pages.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
