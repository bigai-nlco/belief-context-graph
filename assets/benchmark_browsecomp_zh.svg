<svg xmlns="http://www.w3.org/2000/svg" width="620" height="480" viewBox="0 0 620 480" role="img" aria-labelledby="title desc">
  <title id="title">BrowseComp-ZH dual-axis benchmark comparison</title>
  <desc id="desc">Default and BCG accuracy are 49.48 and 59.17 percent. Mean tokens per task are 30.84 thousand for Default and 27.90 thousand for BCG, split into 21.55 thousand Agent and 6.35 thousand Graph tokens.</desc>
  <rect width="620" height="480" rx="18" fill="#ffffff"/>
  <text x="22" y="36" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">BrowseComp-ZH</text>
  <text x="22" y="62" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="15">Full dataset · 289 tasks per mode</text>

  <text x="72" y="108" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Accuracy</text>
  <text x="548" y="108" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end">Mean tokens / task</text>

  <g fill="none" stroke="#e2e8f0" stroke-width="1">
    <path d="M72 126H548 M72 182H548 M72 238H548 M72 294H548 M72 350H548"/>
  </g>
  <path d="M72 126V350H548V126" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M65 201H72 M65 276H72" fill="none" stroke="#64748b" stroke-width="1.2"/>

  <g fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="end">
    <text x="62" y="131">75%</text>
    <text x="62" y="206">50%</text>
    <text x="62" y="281">25%</text>
    <text x="62" y="355">0%</text>
  </g>
  <g fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">
    <text x="556" y="131">40K</text>
    <text x="556" y="187">30K</text>
    <text x="556" y="243">20K</text>
    <text x="556" y="299">10K</text>
    <text x="556" y="355">0</text>
  </g>

  <path d="M132 209a7 7 0 0 1 7-7h46a7 7 0 0 1 7 7v141h-60z" fill="#64748b"/>
  <path d="M204 180a7 7 0 0 1 7-7h46a7 7 0 0 1 7 7v170h-60z" fill="#5b5bd6"/>
  <path d="M356 184a7 7 0 0 1 7-7h46a7 7 0 0 1 7 7v166h-60z" fill="#64748b"/>
  <rect x="428" y="229" width="60" height="121" fill="#5b5bd6"/>
  <path d="M428 199a7 7 0 0 1 7-7h46a7 7 0 0 1 7 7v30h-60z" fill="#aaa8f4"/>

  <g fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="162" y="189">49.48%</text>
    <text x="234" y="160">59.17%</text>
    <text x="386" y="164">30.84K</text>
    <text x="458" y="179">27.90K</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="458" y="294" fill="#ffffff">21.55K</text>
    <text x="458" y="213" fill="#312e81">6.35K</text>
  </g>
  <g fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <text x="162" y="371">Default</text>
    <text x="234" y="371">BCG</text>
    <text x="386" y="371">Default</text>
    <text x="458" y="371">BCG</text>
  </g>
  <g fill="#334155" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="198" y="400">Accuracy</text>
    <text x="422" y="400">Token cost</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#475569">
    <rect x="125" y="445" width="14" height="14" rx="3" fill="#64748b"/>
    <text x="147" y="457">Default</text>
    <rect x="236" y="445" width="14" height="14" rx="3" fill="#5b5bd6"/>
    <text x="258" y="457">BCG</text>
    <rect x="330" y="445" width="14" height="14" rx="3" fill="#aaa8f4"/>
    <text x="352" y="457">Graph portion</text>
  </g>
