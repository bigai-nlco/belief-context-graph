# Unified BCG configuration defaults. This file is the SINGLE source of
# behavioral defaults; code must not re-declare these values. Copy
# config.example.yaml for user configuration; secrets stay in .env and are
# referenced via api_key_env names only.
schema_version: 1

# Default construct backend (bcg.construct.dispatch.DEFAULT_BACKEND).
backend: unified

# Default routing entries selected from the models mapping.
model_key: gpt-5.5
embedding_key: embedding

server:
  host: 127.0.0.1
  port: 8848

# Model routing entries, keyed by model name. The `embedding` key is
# reserved; any other key is a chat model. Secrets never live here.
models: {}

# Graph construction pipeline settings (the former model_config.json
# "belief_graph" section). Both backends share stance, entity, confidence,
# Tool Result, and edge-window settings; hybrid additionally consumes runtime,
# merge, extractor, chunking, and edge-model routing fields.
pipeline:
  runtime:
    evidence_mode: chunk
    context_chars: 12000
    # Node-extraction history window. 0 keeps every recent node that fits
    # context_chars; positive values keep only nodes from the latest N
    # non-empty Graph turns before applying the character budget.
    extraction_history_turns: 2
    min_content_len: 0
  tool_results:
    max_search_results: 10
    max_snippet_chars: 240
    semantic_extraction: true
    max_facts: 3
    max_semantic_calls: 12
  incremental_merge:
    enabled: true
    threshold: 0.76
    keep_newest_text: false
  chunking:
    enabled: true
    breakpoint_percentile_threshold: 95.0
    buffer_size: 1
    min_chunk_sentences: 1
    isolate_tool_calls: true
  confidence:
    initial_method: weighted_average
    evidence_method: product
    source_weight: 0.5
    stance_weight: 0.5
    default_source_reliability: 0.50
    default_stance_quality: 0.50
    source_reliability:
      user: 0.95
      tool: 0.60
      assistant: 0.72
    stance_quality:
      confirmed: 0.94
      almost_certain: 0.86
      probable: 0.74
      possible: 0.60
      unlikely: 0.35
      doubtful: 0.20
      unknown: 0.50
    evidence_log_odds_weight: 0.25
    source_coefficients:
      primary_official: 0.88
      scholarly_publisher: 0.78
      encyclopedia: 0.68
      general_web: 0.58
      community: 0.42
      tabloid_or_entertainment: 0.38
      mixed_or_unattributed: 0.50
    source_domains:
      primary_official: [cboe.com, sec.gov, fred.stlouisfed.org, unesco.org, openai.com, who.int, cdc.gov, data.gov, worldbank.org]
      scholarly_publisher: [pubmed.ncbi.nlm.nih.gov, pmc.ncbi.nlm.nih.gov, arxiv.org, journals.plos.org, sciencedirect.com, link.springer.com, tandfonline.com, dl.acm.org, mdpi.com]
      encyclopedia: [wikipedia.org, britannica.com, investopedia.com]
      community: [reddit.com, quora.com, researchgate.net]
      tabloid_or_entertainment: [tmz.com, pagesix.com, perezhilton.com]
    relation_propagation:
      default_relation_weight: 0.5
      input_confidence_threshold: 0.8
      min_confidence_delta: 0.001
      max_iterations: 3

# SDK-side run defaults (bcg.core.contracts.RunOptions). These are also the
# source of the CLI entry-point defaults (apps/cli_options) after the
# step-7 unification: one value per knob, no legacy profiles.
runner:
  evidence_mode: sentence
  incremental_merge: true
  incremental_merge_threshold: 0.86
  verify_merge: false
  context_chars: 100000
  io_context_chars: 6000
  min_content_len: 0
