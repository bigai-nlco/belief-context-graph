# Example user configuration. Copy to ~/.bcg/config.yaml (user level) or
# <project>/bcg.yaml (project level) and adjust. Every field shown here is
# optional: unset keys fall back to the packaged defaults.yaml values.
# Secrets are NEVER written here; reference them via api_key_env names
# that exist in your .env file.
schema_version: 1

# Default construct backend: unified | hybrid
backend: unified
model_key: graph-model
embedding_key: embedding

server:
  host: 127.0.0.1
  port: 8848

# Model routing. `embedding` is reserved for the embedding backend; other
# keys are chat models used by graph construction.
models:
  graph-model:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    # Optional. Graph construction defaults to none for every model, so changing
    # only `model` never changes reasoning behavior.
    reasoning_effort: none
    max_tokens: 100000
    temperature: 1
    top_p: 0.95
    pricing:
      input_per_1k: 0.005
      output_per_1k: 0.03
  embedding:
    provider: local
    model: /path/to/your/all-MiniLM-L6-v2
    device: cpu
    batch_size: 8
    max_length: 8192
    trust_remote_code: true
    input_prefix: "Document: "

# Graph construction pipeline settings. Unified obtains stance from the Graph
# model's seven-label prompt. The local DeBERTa stance model below is Hybrid-only.
pipeline:
  extractor:
    enabled: true
    provider: openai
    base_url: http://localhost:8001/v1
    api_key_env: BELIEF_GRAPH_LOCAL_API_KEY
    model: Qwen3.5-4B
    temperature: 0
    max_tokens: 2048
    max_concurrency: 4
    request_timeout: 60
    retries: 5
    context_scope: graph
    reasoning_effort: none
    include_turn_content: false
    require_excerpt: false
    dynamic_node_cap: true
    node_cap_unit: char
    node_cap_ratio: 0.004
    node_cap_min: 1
    node_cap_max: 0
  stance:
    # Hybrid backend only; Unified does not load this classifier.
    enabled: true
    model_path: /path/to/your/deberta-v3-large-zeroshot-v2.0
    device: cpu
    batch_size: 16
    max_length: 512
    dynamic_batching: true
    dynamic_batch_wait_ms: 10
    dynamic_batch_max_texts: 128
    local_files_only: true
    hypothesis_template: "{description}"
    labels:
      asserted:
        description: "The speaker presents this as a direct and definite assertion."
      recalled:
        description: "The speaker presents this as something remembered."
      judged:
        description: "The speaker presents this as a judgment or inference."
      speculated:
        description: "The speaker presents this as a guess or possibility."
  edge_generation:
    enabled: true
    provider: openai
    base_url: http://localhost:8001/v1
    api_key_env: BELIEF_GRAPH_LOCAL_API_KEY
    model: Qwen3.5-4B
    temperature: 0
    max_tokens: 2048
    retries: 5
    reasoning_effort: none
    fail_on_error: true
    search_previous_turns: true
    max_previous_windows: 3
  runtime:
    evidence_mode: chunk
    context_chars: 12000
    # 0 = all recent nodes within context_chars; 2 = latest two Graph turns.
    extraction_history_turns: 2
    min_content_len: 0
  tool_results:
    max_search_results: 10
    max_snippet_chars: 240
    semantic_extraction: true
    max_facts: 3
    max_semantic_calls: 12
  incremental_merge:
    enabled: true
    threshold: 0.76
    keep_newest_text: false
  entities:
    method: ml
    spacy_model: en_core_web_sm
    huggingface_model: dslim/bert-base-NER
    device: auto
    confidence_threshold: 0.5
    merge_overlapping: true
    include_standard_types: true
    fallback_methods: [rules, pattern]
    patterns: []
  confidence:
    # Unified uses stance_quality × source_reliability (tool results use
    # source_coefficients instead of the generic tool multiplier).
    initial_method: weighted_average
    evidence_method: product
    source_weight: 0.5
    stance_weight: 0.5
    default_source_reliability: 0.50
    default_stance_quality: 0.50
    source_reliability:
      user: 0.95
      assistant: 0.72
      tool: 0.60
      user_input: 0.85
      assistant_other: 0.65
      tool_call: 0.72
      tool_result: 0.9
      llm_reasoning: 0.58
      historical_retrieval: 0.7
      manual: 0.86
      unknown: 0.55
    stance_quality:
      confirmed: 0.94
      almost_certain: 0.86
      probable: 0.74
      possible: 0.60
      unlikely: 0.35
      doubtful: 0.20
      unknown: 0.50
    evidence_log_odds_weight: 0.25
    source_coefficients:
      primary_official: 0.88
      scholarly_publisher: 0.78
      encyclopedia: 0.68
      general_web: 0.58
      community: 0.42
      tabloid_or_entertainment: 0.38
      mixed_or_unattributed: 0.50
    source_domains:
      primary_official: [cboe.com, sec.gov, fred.stlouisfed.org, unesco.org, openai.com, who.int, cdc.gov, data.gov, worldbank.org]
      scholarly_publisher: [pubmed.ncbi.nlm.nih.gov, pmc.ncbi.nlm.nih.gov, arxiv.org, journals.plos.org, sciencedirect.com, link.springer.com, tandfonline.com, dl.acm.org, mdpi.com]
      encyclopedia: [wikipedia.org, britannica.com, investopedia.com]
      community: [reddit.com, quora.com, researchgate.net]
      tabloid_or_entertainment: [tmz.com, pagesix.com, perezhilton.com]
    relation_propagation:
      default_relation_weight: 0.5
      input_confidence_threshold: 0.8
      min_confidence_delta: 0.001
      max_iterations: 3
  chunking:
    enabled: true
    breakpoint_percentile_threshold: 95.0
    buffer_size: 1
    min_chunk_sentences: 1
    isolate_tool_calls: true

# SDK-side run defaults; these override the packaged defaults when set.
runner:
  evidence_mode: sentence
  incremental_merge: true
  incremental_merge_threshold: 0.86
  verify_merge: false
  context_chars: 100000
  io_context_chars: 6000
  min_content_len: 0
