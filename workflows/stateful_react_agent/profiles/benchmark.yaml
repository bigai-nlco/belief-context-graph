# Long-running single-agent benchmark profile with BCG graph-backed context.
llm:
  model: ${OPENAI_MODEL}
  api_key: ${OPENAI_API_KEY}
  base_url: ${OPENAI_BASE_URL}
  # Not 0.0: at temperature 0 sglang takes the argmax path, which turns a
  # reasoning runaway into a deterministic deadlock the loop cannot leave (a
  # runaway context resampled 4x at temp=0 returned byte-identical output; one
  # question burned 176 minutes over 117 runaways). See
  # workflows/agent_team/profiles/benchmark.yaml for the full measurement.
  # Values are the model's generation_config.json defaults. Moving temperature
  # is the load-bearing part — top_p/top_k are inert while it is 0.
  temperature: 1.0
  top_p: 0.95
  extra_body:
    top_k: 20
  max_tokens: 4096 

agent:
  main_max_turns: 100
  tool_timeout_s: 900
  llm_timeout_s: 600
  reasoning_only_timeout_s: 120
  reasoning_only_max_tokens: 16384
  logical_call_timeout_s: 900
  thinking_in_history: true
  bcg:
    url: ${BCG_GRAPH_URL:-http://127.0.0.1:8850}
    recent_turns: ${BCG_RECENT_TURNS:-2}
    graph_chars: ${BCG_GRAPH_CHARS:-6600}
    timeout: ${BCG_GRAPH_TIMEOUT:-120}
  max_len: ${OPENAI_CONTEXT_WINDOW:-49152}
  max_input_tokens: ${OPENAI_MAX_INPUT_TOKENS:-40000}
  agent_tools: [web_search, web_fetch, bash, download_file, grep_search, glob_search, recover_result]
  web_search_impl: original
  web_fetch_impl: original
