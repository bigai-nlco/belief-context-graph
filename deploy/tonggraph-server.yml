# BCG TongGraph Server deployment.

host: 0.0.0.0
port: 8719

# Portable template default; scripts/start_tonggraph_server.sh injects the
# effective TONGGRAPH_DATA_DIR into a runtime copy of this file.
data_dir: ./var/tonggraph

graphs:
  agent_workspace:
    path: agent_workspace.db
    logical_graphs: true

operations:
  request_logging: true
  request_timeout_seconds: 30
  metrics: true

auth:
  mode: token
  users:
    admin:
      admin: true
      token_env: TONGGRAPH_ADMIN_TOKEN
      graphs:
        "*": write
    agent_writer:
      token_env: TONGGRAPH_AGENT_WRITER_TOKEN
      graphs:
        agent_workspace: write
    agent_reader:
      token_env: TONGGRAPH_AGENT_READER_TOKEN
      graphs:
        agent_workspace: read
